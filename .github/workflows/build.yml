name: Build Ki Warriors

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extract project
        run: |
          unzip -q KiWarriorsAndroid_GooglePlayReady.zip
          ls -la KiWarriorsAndroid

      - name: Build Android App Bundle
        working-directory: KiWarriorsAndroid
        run: gradle bundleRelease

      - name: Save AAB
        uses: actions/upload-artifact@v4
        with:
          name: KiWarriors-AAB
          path: KiWarriorsAndroid/app/build/outputs/bundle/release/*.aab
