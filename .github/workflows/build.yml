name: Build Ki Warriors

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Find project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'KiWarriorsAndroid_GooglePlayReady*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: KiWarriorsAndroid_GooglePlayReady ZIP not found."
            exit 1
          fi

          echo "Found project ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          unzip -q "$ZIP_FILE"
          echo "Project extracted."
          ls -la KiWarriorsAndroid

      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_HEX: ${{ secrets.KEYSTORE_HEX }}
        run: |
          if [ -z "$KEYSTORE_HEX" ]; then
            echo "ERROR: KEYSTORE_HEX secret is missing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_HEX" | xxd -r -p > upload-keystore.jks

          if [ ! -s upload-keystore.jks ]; then
            echo "ERROR: Keystore file was not created."
            exit 1
          fi

          echo "Keystore decoded successfully."

      - name: Check signing keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list \
            -keystore upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD"

      - name: Build Android App Bundle
        working-directory: KiWarriorsAndroid
        shell: bash
        run: |
          gradle bundleRelease

      - name: Sign AAB
        working-directory: KiWarriorsAndroid
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore ../upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            app/build/outputs/bundle/release/app-release.aab \
            "$KEY_ALIAS"

      - name: Verify signed AAB
        working-directory: KiWarriorsAndroid
        shell: bash
        run: |
          jarsigner \
            -verify \
            -verbose \
            -certs \
            app/build/outputs/bundle/release/app-release.aab

      - name: Save AAB
        uses: actions/upload-artifact@v4
        with:
          name: KiWarriors-AAB
          path: KiWarriorsAndroid/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
